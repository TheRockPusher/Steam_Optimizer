name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment to apply"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Resolve and prepare release reference
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          create_tag=false
          update_version=false
          base_version=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "Manual production releases must run from main." >&2
              exit 1
            fi
            case "$INPUT_BUMP" in
              patch|minor|major) ;;
              *)
                echo "Manual release increment must be patch, minor, or major." >&2
                exit 1
                ;;
            esac
          else
            release_tag="$REF_NAME"
            if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH: $release_tag" >&2
              exit 1
            fi
            if [[ "$REF_PROTECTED" != "true" ]]; then
              echo "Release tag must be protected by an active GitHub ruleset." >&2
              exit 1
            fi
          fi

          git fetch --no-tags --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release commit is not on origin/main." >&2
            exit 1
          fi

          project_version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("backend/pyproject.toml").open("rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"
          if [[ ! "$project_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "backend project.version must match MAJOR.MINOR.PATCH: $project_version" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG_COMMIT" 2>/dev/null || true)"
            if [[ -n "$latest_tag" ]]; then
              base_version="${latest_tag#v}"
            else
              base_version="$project_version"
            fi
            if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Latest release tag must match vMAJOR.MINOR.PATCH: ${latest_tag:-<none>}" >&2
              exit 1
            fi
            release_version="$(
              BASE_VERSION="$base_version" BUMP_LEVEL="$INPUT_BUMP" python - <<'PY'
          import os

          major, minor, patch = (int(part) for part in os.environ["BASE_VERSION"].split("."))
          match os.environ["BUMP_LEVEL"]:
              case "major":
                  major, minor, patch = major + 1, 0, 0
              case "minor":
                  minor, patch = minor + 1, 0
              case "patch":
                  patch += 1
              case _:
                  raise SystemExit("invalid release increment")
          print(f"{major}.{minor}.{patch}")
          PY
            )"
            release_tag="v$release_version"
            if [[ "$project_version" != "$base_version" && "$project_version" != "$release_version" ]]; then
              echo "backend project.version must match the latest release or the calculated next version." >&2
              exit 1
            fi
            if [[ "$project_version" != "$release_version" ]]; then
              update_version=true
            fi
            existing_commit="$(git ls-remote --refs origin "refs/tags/$release_tag" | cut -f1)"
            if [[ -n "$existing_commit" ]]; then
              if [[ "$existing_commit" != "$TAG_COMMIT" ]]; then
                echo "Release tag already points to another commit: $release_tag" >&2
                exit 1
              fi
              if [[ "$update_version" == "true" ]]; then
                echo "Release tag exists before the source version bump: $release_tag" >&2
                exit 1
              fi
            else
              create_tag=true
            fi
          else
            release_version="${release_tag#v}"
            base_version="$release_version"
            if [[ "$release_version" != "$project_version" ]]; then
              echo "Release tag version and backend project.version differ." >&2
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$update_version" == "true" ]]; then
            if [[ "$(git rev-parse origin/main)" != "$TAG_COMMIT" ]]; then
              echo "main changed while preparing the release; refusing to push the version commit." >&2
              exit 1
            fi
            python - "$release_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("backend/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{sys.argv[1]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find backend project.version.")
          path.write_text(updated, encoding="utf-8")
          PY
            uv lock --project backend
            if git diff --quiet -- backend/pyproject.toml backend/uv.lock; then
              echo "The calculated release version did not change backend metadata." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/pyproject.toml backend/uv.lock
            git commit -m "chore: prepare release v$release_version"
            git push origin HEAD:main
            TAG_COMMIT="$(git rev-parse HEAD)"
          fi


          {
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "release_commit=$TAG_COMMIT"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release tag
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Validate tag, main ancestry, and backend version
        env:
          TAG: ${{ needs.prepare.outputs.release_tag }}
          TAG_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          TAG_VERSION: ${{ needs.prepare.outputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_PROTECTED" != "true" ]]; then
            echo "Release tag must be protected by an active GitHub ruleset." >&2
            exit 1
          fi

          git fetch --no-tags --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag commit is not on origin/main." >&2
            exit 1
          fi

          project_version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("backend/pyproject.toml").open("rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"
          if [[ "$TAG_VERSION" != "$project_version" ]]; then
            echo "Release tag version and backend project.version differ." >&2
            exit 1
          fi

  ci:
    name: Run CI checks
    needs: [prepare, validate]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.release_commit }}
    permissions:
      contents: read

  deploy-backend:
    name: Deploy backend to production
    needs: [prepare, validate, ci]
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.44.1
      - name: Deploy backend source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up ./backend --path-as-root --project "$RAILWAY_PROJECT_ID" --environment production --service backend

  smoke-backend:
    name: Smoke check backend
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check backend health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.BACKEND_URL }}/api/health"

  deploy-frontend:
    name: Deploy frontend to production
    needs: [prepare, smoke-backend]
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.44.1
      - name: Deploy frontend source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up ./frontend --path-as-root --project "$RAILWAY_PROJECT_ID" --environment production --service frontend

  smoke-frontend:
    name: Smoke check frontend
    needs: deploy-frontend
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check frontend root
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.FRONTEND_URL }}/"
      - name: Check proxied authentication endpoints
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import parse_qs, urlsplit
          from urllib.request import HTTPRedirectHandler, build_opener, urlopen

          frontend_url = os.environ["FRONTEND_URL"].rstrip("/")

          with urlopen(f"{frontend_url}/api/auth/session", timeout=20) as response:
              session = json.load(response)
          if session != {"authenticated": False}:
              raise SystemExit(f"Unexpected session response: {session!r}")

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(
                  self,
                  request,
                  file_pointer,
                  code,
                  message,
                  headers,
                  new_url,
              ):
                  return None

          try:
              build_opener(NoRedirect).open(
                  f"{frontend_url}/api/auth/steam/start",
                  timeout=20,
              )
          except HTTPError as error:
              if error.code != 302:
                  raise
              redirect_response = error
          else:
              raise SystemExit("Steam start endpoint did not redirect.")

          location = redirect_response.headers["Location"]
          redirect_url = urlsplit(location)
          if (
              redirect_url.scheme != "https"
              or redirect_url.netloc != "steamcommunity.com"
              or redirect_url.path != "/openid/login"
          ):
              raise SystemExit(f"Unexpected Steam redirect: {location}")

          parameters = parse_qs(redirect_url.query)
          return_to = parameters.get("openid.return_to", [""])[0]
          expected_callback = f"{frontend_url}/api/auth/steam/callback?state="
          if not return_to.startswith(expected_callback):
              raise SystemExit(f"Unexpected OpenID return_to: {return_to}")

          state_cookie = redirect_response.headers.get("Set-Cookie", "")
          required_attributes = ("HttpOnly", "Secure", "SameSite=lax")
          if not all(attribute in state_cookie for attribute in required_attributes):
              raise SystemExit("Steam login-state cookie is missing secure attributes.")
          PY

  release:
    name: Publish release notes
    needs:
      [
        prepare,
        validate,
        ci,
        deploy-backend,
        smoke-backend,
        deploy-frontend,
        smoke-frontend,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ needs.prepare.outputs.release_tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Verify final release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          project_version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("backend/pyproject.toml").open("rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"
          if [[ "$RELEASE_VERSION" != "$project_version" ]]; then
            echo "Final source version and release version differ." >&2
            exit 1
          fi
      - name: Create protected release tag
        if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$RELEASE_COMMIT"; then
            echo "Could not create the protected release tag. Grant the GitHub Actions actor bypass access to the release-tag ruleset, or use the protected-tag UI flow." >&2
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ needs.prepare.outputs.release_commit }}
