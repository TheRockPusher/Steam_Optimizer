[changelog]
header = """
# Changelog

All notable changes to Steam Optimizer are documented here.
"""
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | upper_first }}{% if commit.breaking %} **(breaking)**{% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
Generated by [git-cliff](https://git-cliff.org/).
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Testing" },
  { message = "^(build|ci|chore)", group = "Maintenance" },
  { message = "^revert", group = "Reverted" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
